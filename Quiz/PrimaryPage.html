<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFA Aircraft Rec</title>
    <link rel="stylesheet" href="../cleancss.css">
    <link rel="stylesheet" href="../public/style.css">
    <link rel="stylesheet" href="../CSS/primpage.css">
</head>
<body>
    <main>
        <h1>What would you like to do today?</h1>
        <select id="tagSelect">
            <option value="Select a Tag" selected>Select a Tag</option>
        </select>
        <div class="trisplit">
            <a href="learn.html" class="activity">
                <img src="../img/Activities/portrait.jpg" alt="Alt text">
                <h2>Learn</h2>
            </class=>
            </a>
            <a href="practice.html" class="activity">
                <img src="../img/Activities/portrait.jpg" alt="Alt text">
                <h2>Practice</h2>
            </class=>
            </a>
            <a href="testPre.html" class="activity">
                <img src="../img/Activities/portrait.jpg" alt="Alt text">
                <h2>Test</h2>
                <p id="highscore"></p>
            </class=>
            </a>
        </div>
    </main>
    <script>
        function getCookie(name) {
            const value = "; " + document.cookie;
            const parts = value.split("; " + name + "=");
            if (parts.length == 2) return parts.pop().split(";").shift();
        };

        document.getElementById('highscore').textContent = `High score: ${getCookie('highscore')}`;

        if (getCookie('highscore') == undefined) {
            document.getElementById('highscore').style.display = 'none';
            document.getElementById('highscore').style.visibility = 'hidden';
        };
    </script>
</body>
</html>
